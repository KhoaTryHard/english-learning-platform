name: Verify owner services
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements-dev.txt && python scripts/check-contracts.py
      - run: bash scripts/init-dev.sh && docker compose build user && docker compose --profile demo up -d --wait --wait-timeout 180
      - run: docker compose run --rm --no-deps admin-bootstrap && docker compose run --rm --no-deps content-seed && python scripts/smoke.py
      - run: python scripts/verify-operations.py
      - run: docker compose logs --no-color > compose.log
        if: failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            backend/**/target/surefire-reports/*
            docs/verification-junit.json
            docs/verification-smoke.json
            docs/verification-operations.json
            compose.log
