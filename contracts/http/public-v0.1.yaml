          type: array
          items:
            $ref: '#/components/schemas/ImportIssue'
      required:
      - status
      - totalItems
      - validCount
      - invalidCount
      - createdCount
      - createdIds
      - errors
      description: 'Atomic per file. REJECTED => createdCount=0, createdIds=[]. Parseable:
        validCount+invalidCount=totalItems, distinct item counts. Container not parseable
        => counts=null. Locations 1-based; Excel includes header row in physical row
        index.'
      example:
        status: SUCCESS
        totalItems: 2
        validCount: 2
        invalidCount: 0
        createdCount: 2
        createdIds:
        - 10000000-0000-4000-8000-000000000011
        - 10000000-0000-4000-8000-000000000012
        errors: []
