    ImportOutcome:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - REJECTED
        totalItems:
          type: integer
          minimum: 0
          nullable: true
        validCount:
          type: integer
          minimum: 0
          nullable: true
        invalidCount:
          type: integer
          minimum: 0
          nullable: true
        createdCount: *id009
        createdIds:
          type: array
          items: *id001
