    post:
      operationId: importVocabulary
      summary: Import Vocabulary Excel
      description: Synchronous atomic file import. Auth/CSRF then target/container/whole
        file validation before one Content transaction. No skip/update/partial success.
        Duplicate DB or commit race409 rollback. Validation422, malformed container400,
        limits413, wrong format415. No business rows on failure; ImportError holds
        location/counts. Two files are separate transactions. Do not automatically
        retry after response loss; inspect created records before resending, duplicate
        returns409.
      tags:
      - Learning Content Service
      security:
      - accessCookie: []
        csrfHeader: []
      responses:
        '201':
          description: Import Vocabulary Excel — success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportOutcome'
        '400':
          description: Malformed input / field validation / unknown fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          description: Resource missing or hidden to Learner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '409':
          description: Conflict / not ready / invalid state / uniqueness race
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '413':
          description: Request or expanded file over configured limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '415':
          description: Unsupported media/file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '422':
          description: Parseable import data invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '500':
          description: Unexpected failure; local transaction rolled back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '503':
          description: Session/source dependency unavailable; fail closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
      x-owner-service: Learning Content Service
      x-roles:
      - ADMIN
