openapi: 3.0.3
info:
  title: W3-04 — English Online Learning Platform API
  version: 0.1.0-proposed
  description: Khoa author 11/10/2026. REVIEW DRAFT; W2 business rules fixed, DD-01..13
    and W3-04 technical choices proposed. Not production implementation/approval.
    All external paths through Gateway; service boundaries User/Content/Assessment/Progress.
servers:
- url: /api/v1
  description: Relative Gateway base; no actual deployed host assumed
paths:
  /auth/csrf:
    get:
      operationId: getCsrf
      summary: Lấy CSRF token trước login/register
      description: Proposed synchronizer token with short-lived server pre-session;
        no access JWT required. Return Cache-Control:no-store and HttpOnly pre-session
        cookie. Rotate/destroy pre-session on login, get new CSRF token for authenticated
        session. Tokens not in URL/logs; no business data. Login requires configured
        Origin check as additional defense.
      tags:
      - User Service
      security: []
      responses:
        '200':
          description: Lấy CSRF token trước login/register — success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '400':
          $ref: '#/components/responses/400'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-owner-service: User Service
      x-roles:
      - PUBLIC
      x-fr:
      - FR-01
      - FR-02
      - FR-03
      x-uc:
      - UC-01
      x-pb:
      - PB-01
      x-ac:
      - AC-01
      - AC-02
      - AC-19
      x-design-decisions:
      - DD-03
      x-contract-status: PROPOSED_FOR_REVIEW
      x-ui-screens:
      - L-01
      - L-02
  /auth/register:
    post:
      operationId: register
      summary: Đăng ký Learner
      description: Email trim/lowercase <=254, no dot/+tag stripping. Password code
        point/UTF-8 byte checks; BCrypt. fullName blank => null. Unknown fields including
        role =>400. Assign LEARNER; seeded Admin only. No implicit login. 409 REGISTRATION_CONFLICT
        generic message; transactional account/profile creation.
      tags:
      - User Service
      security:
      - csrfHeader: []
      responses:
        '201':
          description: Đăng ký Learner — success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-owner-service: User Service
      x-roles:
      - PUBLIC
      x-fr:
      - FR-01
      - FR-05
      x-uc:
      - UC-01
      x-pb:
      - PB-01
      x-ac:
      - AC-01
      - AC-19
      x-design-decisions:
      - DD-01
      - DD-03
      x-contract-status: PROPOSED_FOR_REVIEW
      x-ui-screens:
      - L-01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      operationId: login
      summary: Đăng nhập bằng email/password
      description: Generic 401 INVALID_CREDENTIALS for absent email, incorrect password
        or blocked account. Set access_token cookie (HttpOnly; Secure on HTTPS; SameSite=Lax;
        Path=/api/v1; host-only). 30 minute JWT default environment configurable;
        no refresh. JSON never returns JWT. Rotate pre-session and CSRF state; fetch
        /auth/csrf again after successful login.
      tags:
      - User Service
      security:
      - csrfHeader: []
      responses:
        '200':
          description: Đăng nhập bằng email/password — success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      x-owner-service: User Service
      x-roles:
      - PUBLIC
      x-fr:
      - FR-02
      - FR-05
      x-uc:
      - UC-01
      x-pb:
      - PB-01
      x-ac:
      - AC-02
      - AC-19
      x-design-decisions:
      - DD-01
      - DD-03
      x-contract-status: PROPOSED_FOR_REVIEW
      x-ui-screens:
      - L-02
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /auth/logout:
    post:
      operationId: logout
      summary: Thu hồi JWT rồi xóa cookie
      description: 'Validate CSRF and current JWT. Persist jti/exp in User DB before
        deleting access_token with identical Path/Domain scope, Max-Age=0. Also invalidate
        CSRF/pre-session state. Revocation failure =>503/500, never success 204; no
        refresh token. Strict draft: expired/revoked session =>401 (idempotent repeated
        logout UX needs reviewer confirmation).'
      tags:
      - User Service
      security:
      - accessCookie: []
        csrfHeader: []
      responses:
        '204':
          description: Thu hồi JWT rồi xóa cookie — success
        '400':
