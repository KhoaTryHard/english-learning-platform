      description: RFC3339 UTC; server uses Z suffix.
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - field
      - code
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
        traceId: *id001
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - message
      - traceId
      - errors
      example:
        code: VALIDATION_ERROR
        message: Dữ liệu không hợp lệ
        traceId: 10000000-0000-4000-8000-000000000001
        errors:
        - field: fullName
          code: TOO_LONG
          message: Tối đa 100 ký tự
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email: &id005
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 15
          writeOnly: true
          description: 15 Unicode code points minimum AND at most 72 UTF-8 bytes.
            No trim/truncation; byte limit enforced by server, not maxLength.
        fullName: &id006
          type: string
          minLength: 0
          maxLength: 100
          description: Trim; null or blank normalizes to null.
          nullable: true
      required:
      - email
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email: *id005
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - email
      - password
    Profile:
