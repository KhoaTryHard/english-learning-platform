services:
  user-db:
    image: postgres:17
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/user_bootstrap
    secrets:
    - user_bootstrap
    - user_migration
    - user_runtime
    volumes:
    - user-data:/var/lib/postgresql/data
    - ./backend/services/user-service/deploy/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
    - user-data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d user_db
      interval: 5s
      timeout: 3s
      retries: 20
  content-db:
    image: postgres:17
    environment:
      POSTGRES_DB: content_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/content_bootstrap
    secrets:
    - content_bootstrap
    - content_migration
    - content_runtime
    volumes:
    - content-data:/var/lib/postgresql/data
    - ./backend/services/learning-content-service/deploy/init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    networks:
    - content-data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d content_db
      interval: 5s
      timeout: 3s
      retries: 20
  user-migrate:
    image: group7-user-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/services/user-service
    environment:
      SERVICE: user
      PLATFORM_KEYS: /keys
      USER_URL: http://user:8081
      CONTENT_URL: http://content:8082
      ASSESSMENT_URL: ${ASSESSMENT_URL:-http://assessment:8080}
      PROGRESS_URL: ${PROGRESS_URL:-http://progress:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USER: user_migration
      DB_PASSWORD_FILE: /run/secrets/user_migration
      MIGRATE: 'true'
      PLATFORM_MODE: migrate
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=UTC
      PRIVATE_KEY_FILE: /private/user.private.pem
    volumes: &id001
    - ./.secrets/keys/public:/keys:ro
    - ./.secrets/keys/user.private.pem:/private/user.private.pem:ro
    networks: &id002
    - backend
    - user-data
    secrets:
    - user_migration
    depends_on:
      user-db:
        condition: service_healthy
  user:
    image: group7-user-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/services/user-service
    environment:
      SERVICE: user
      PLATFORM_KEYS: /keys
      USER_URL: http://user:8081
      CONTENT_URL: http://content:8082
      ASSESSMENT_URL: ${ASSESSMENT_URL:-http://assessment:8080}
      PROGRESS_URL: ${PROGRESS_URL:-http://progress:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USER: user_runtime
      DB_PASSWORD_FILE: /run/secrets/user_runtime
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=UTC
      PRIVATE_KEY_FILE: /private/user.private.pem
    volumes: *id001
    networks: *id002
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8081/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    secrets:
    - user_runtime
    depends_on: &id005
      user-migrate:
        condition: service_completed_successfully
  content-migrate:
    image: group7-learning-content-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/services/learning-content-service
    environment:
      SERVICE: content
      PLATFORM_KEYS: /keys
      USER_URL: http://user:8081
      CONTENT_URL: http://content:8082
      ASSESSMENT_URL: ${ASSESSMENT_URL:-http://assessment:8080}
      PROGRESS_URL: ${PROGRESS_URL:-http://progress:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DB_URL: jdbc:postgresql://content-db:5432/content_db
      DB_USER: content_migration
      DB_PASSWORD_FILE: /run/secrets/content_migration
      MEDIA_HOSTS: ${MEDIA_HOSTS:-}
      MIGRATE: 'true'
      PLATFORM_MODE: migrate
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=UTC
      PRIVATE_KEY_FILE: /private/content.private.pem
    volumes: &id003
    - ./.secrets/keys/public:/keys:ro
    - ./.secrets/keys/content.private.pem:/private/content.private.pem:ro
    networks: &id004
    - backend
    - content-data
    secrets:
    - content_migration
    depends_on:
      content-db:
        condition: service_healthy
  content:
    image: group7-learning-content-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/services/learning-content-service
    environment:
      SERVICE: content
      PLATFORM_KEYS: /keys
      USER_URL: http://user:8081
      CONTENT_URL: http://content:8082
      ASSESSMENT_URL: ${ASSESSMENT_URL:-http://assessment:8080}
      PROGRESS_URL: ${PROGRESS_URL:-http://progress:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DB_URL: jdbc:postgresql://content-db:5432/content_db
      DB_USER: content_runtime
      DB_PASSWORD_FILE: /run/secrets/content_runtime
      MEDIA_HOSTS: ${MEDIA_HOSTS:-}
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=UTC
      PRIVATE_KEY_FILE: /private/content.private.pem
    volumes: *id003
    networks: *id004
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8082/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    secrets: &id006
    - content_runtime
    depends_on: &id007
      content-migrate:
        condition: service_completed_successfully
  api:
    image: group7-api-gateway:${IMAGE_TAG:-local}
    build:
      context: ./backend/api-gateway
    environment:
      SERVICE: api
      PLATFORM_KEYS: /keys
      USER_URL: http://user:8081
      CONTENT_URL: http://content:8082
      ASSESSMENT_URL: ${ASSESSMENT_URL:-http://assessment:8080}
      PROGRESS_URL: ${PROGRESS_URL:-http://progress:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=UTC
      PRIVATE_KEY_FILE: /private/api.private.pem
    volumes:
    - ./.secrets/keys/public:/keys:ro
    - ./.secrets/keys/api.private.pem:/private/api.private.pem:ro
    networks:
    - backend
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://localhost:8080/actuator/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
    - ${GATEWAY_PORT:-8080}:8080
    depends_on:
      user:
        condition: service_healthy
      content:
        condition: service_healthy
  assessment:
    image: wiremock/wiremock:3.13.1
    profiles:
    - demo
    volumes:
    - ./infra/mock:/home/wiremock:ro
    networks:
    - backend
  admin-bootstrap:
    image: group7-user-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/services/user-service
    environment:
      SERVICE: user
      PLATFORM_KEYS: /keys
      USER_URL: http://user:8081
      CONTENT_URL: http://content:8082
      ASSESSMENT_URL: ${ASSESSMENT_URL:-http://assessment:8080}
      PROGRESS_URL: ${PROGRESS_URL:-http://progress:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DB_URL: jdbc:postgresql://user-db:5432/user_db
      DB_USER: user_runtime
      DB_PASSWORD_FILE: /run/secrets/user_runtime
      PLATFORM_MODE: bootstrap-admin
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=UTC
      PRIVATE_KEY_FILE: /private/user.private.pem
    volumes: *id001
    networks: *id002
    secrets:
    - user_runtime
    - admin_password
    depends_on: *id005
    profiles:
    - tools
  content-seed:
    image: group7-learning-content-service:${IMAGE_TAG:-local}
    build:
      context: ./backend/services/learning-content-service
    environment:
      SERVICE: content
      PLATFORM_KEYS: /keys
      USER_URL: http://user:8081
      CONTENT_URL: http://content:8082
      ASSESSMENT_URL: ${ASSESSMENT_URL:-http://assessment:8080}
      PROGRESS_URL: ${PROGRESS_URL:-http://progress:8080}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DB_URL: jdbc:postgresql://content-db:5432/content_db
      DB_USER: content_runtime
      DB_PASSWORD_FILE: /run/secrets/content_runtime
      MEDIA_HOSTS: ${MEDIA_HOSTS:-}
      PLATFORM_MODE: seed
      SEED_FILE: /seed/course-levels.json
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=UTC
      PRIVATE_KEY_FILE: /private/content.private.pem
    volumes:
    - ./.secrets/keys/public:/keys:ro
    - ./.secrets/keys/content.private.pem:/private/content.private.pem:ro
    - ./backend/services/learning-content-service/deploy/course-levels.json:/seed/course-levels.json:ro
    networks: *id004
    secrets: *id006
    depends_on: *id007
    profiles:
    - tools
volumes:
  user-data: {}
  content-data: {}
networks:
  backend: {}
  user-data:
    internal: true
  content-data:
    internal: true
secrets:
  user_bootstrap:
    file: ./.secrets/user_bootstrap
  user_migration:
    file: ./.secrets/user_migration
  user_runtime:
    file: ./.secrets/user_runtime
  content_bootstrap:
    file: ./.secrets/content_bootstrap
  content_migration:
    file: ./.secrets/content_migration
  content_runtime:
    file: ./.secrets/content_runtime
  admin_password:
    file: ./.secrets/admin_password
