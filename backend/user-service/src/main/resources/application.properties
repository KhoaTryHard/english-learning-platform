spring.application.name=user-service
server.port=8081
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
platform.service=user
platform.keys=${PLATFORM_KEYS:.secrets/keys}
platform.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
platform.secure-cookies=${SECURE_COOKIES:false}
platform.user-url=${USER_URL:http://localhost:8081}
platform.content-url=${CONTENT_URL:http://localhost:8082}
platform.assessment-url=${ASSESSMENT_URL:http://localhost:8090}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5541/user_db}
spring.datasource.username=${DB_USER:user_runtime}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=${MIGRATE:false}
spring.sql.init.mode=never
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
platform.mode=${PLATFORM_MODE:serve}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.session.jdbc.initialize-schema=never
spring.session.timeout=15m
platform.jwt-minutes=${JWT_MINUTES:30}
