spring.application.name=assessment-service
server.port=${PORT:8090}
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5543/assessment_db}
spring.datasource.username=${DB_USER:assessment}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.enabled=true
spring.sql.init.mode=never
platform.service=assessment
platform.keys=${PLATFORM_KEYS:.secrets/keys}
platform.private-key=${PRIVATE_KEY_FILE:}
platform.user-url=${USER_URL:http://localhost:8081}
platform.content-url=${CONTENT_URL:http://localhost:8082}
assessment.expiry-delay-ms=${EXPIRY_DELAY_MS:10000}
