spring.application.name=progress-service
server.port=${PORT:8091}
server.error.include-message=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5544/progress_db}
spring.datasource.username=${DB_USER:progress}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.flyway.enabled=true
platform.service=progress
platform.keys=${PLATFORM_KEYS:.secrets/public}
platform.private-key=${PRIVATE_KEY_FILE:.secrets/progress.private.pem}
platform.user-url=${USER_URL:http://localhost:8081}
platform.content-url=${CONTENT_URL:http://localhost:8082}
progress.kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=progress-assessment-v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
