services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: progress_db
      POSTGRES_USER: ${DB_USER:-progress}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5544}:5432"
    volumes:
      - progress_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d progress_db"]
      interval: 5s
      timeout: 3s
      retries: 20
  progress:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-8091}:8091"
    environment:
      DB_URL: jdbc:postgresql://db:5432/progress_db
      DB_USER: ${DB_USER:-progress}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      USER_URL: ${USER_URL:-http://host.docker.internal:8081}
      CONTENT_URL: ${CONTENT_URL:-http://host.docker.internal:8082}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-host.docker.internal:9092}
      PLATFORM_KEYS: /run/public-keys
      PRIVATE_KEY_FILE: /run/progress.private.pem
    volumes:
      - type: bind
        source: ${PUBLIC_KEYS_DIR:-./.secrets/public}
        target: /run/public-keys
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PRIVATE_KEY_FILE:-./.secrets/progress.private.pem}
        target: /run/progress.private.pem
        read_only: true
        bind:
          create_host_path: false
volumes:
  progress_data:
