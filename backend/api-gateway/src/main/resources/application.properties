spring.application.name=api-gateway
server.port=8080
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
platform.service=api
platform.keys=${PLATFORM_KEYS:.secrets/keys}
platform.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
platform.secure-cookies=${SECURE_COOKIES:false}
platform.user-url=${USER_URL:http://localhost:8081}
platform.content-url=${CONTENT_URL:http://localhost:8082}
platform.assessment-url=${ASSESSMENT_URL:http://localhost:8090}

platform.private-key=${PRIVATE_KEY_FILE:}
platform.progress-url=${PROGRESS_URL:http://localhost:8084}
