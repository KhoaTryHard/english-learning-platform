openapi: 3.0.3
info:
  title: W3-04 Internal REST contracts — private network only
  version: 0.1.0-proposed
  description: Not Gateway/browser API. URLs below are service-relative routing suggestions,
    not deployed hosts. Owner service identified per operation. Requires private network
    and authenticated caller; independent user JWT is insufficient. Draft proposes
    dedicated service JWT bearer/audience/internal caller allowlist; signing/key rotation/transport
    policy must be reviewed by Huy before implementation. No cross-service DB access.
servers:
- url: /internal/v1
  description: Relative base at owner service; NEVER expose from public Gateway
paths:
  /sessions/validate:
    post:
      operationId: validateSession
      summary: validateSession
      description: User validates fixed algorithm/signature/iss/aud/iat/exp, role
        and jti. Check account ACTIVE and revoked jti. Invalid/expired/blocked/revoked=>401;
        unavailable DB/validation=>503. Never log/echo raw token. Gateway maps to
        401/503; fail closed. Needs internal service identity; user token alone cannot
        call.
      security:
      - serviceIdentity: []
      x-owner-service: User Service
      x-allowed-callers:
      - API Gateway
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPrincipal'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCheckRequest'
  /users/{userId}/learning-setup:
    get:
      operationId: getUserSetupInternal
      summary: getUserSetupInternal
      description: Read current user-owned Course/Level for attempt snapshot/dashboard.
        userId external reference; service caller authentication and purpose allowlist.
        No arbitrary client forwarding.
      security:
      - serviceIdentity: []
      x-owner-service: User Service
      x-allowed-callers:
      - Assessment Service
      - Progress Service
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: userId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
  /learners/cohort:
    get:
      operationId: getLearnerCohort
      summary: getLearnerCohort
      description: All role LEARNER incl BLOCKED. Filter current Course/Level; totalLearnersGlobal
        ignores filters. current setup snapshots; page stable userId. Multiple-page
        cohort drift open issue for review, generatedAt not global transaction.
      security:
      - serviceIdentity: []
      x-owner-service: User Service
      x-allowed-callers:
      - Progress Service
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CohortPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: courseId
        in: query
        required: false
        schema: *id001
      - name: levelId
        in: query
        required: false
        schema: *id001
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
  /courses/{courseId}/context:
    get:
      operationId: getCourseContext
      summary: getCourseContext
      description: Internal source includes total all persisted Lessons, including
        unpublished, and Levels belonging Course. Consumer uses visibility for new
        setup/attempt; statistics counts hidden Lessons. No direct database joins.
      security:
      - serviceIdentity: []
      x-owner-service: Learning Content Service
      x-allowed-callers:
      - User Service
      - Assessment Service
      - Progress Service
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseContext'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: courseId
        in: path
        required: true
        schema: *id001
  /courses/contexts:
    get:
      operationId: listCourseContexts
      summary: listCourseContexts
      description: All persisted Courses for unfiltered statistics incl zero-Learner/zero-Result
        Courses and unpublished; each context counts all Lessons. Stable ID ordering;
        no source entity writes.
      security:
      - serviceIdentity: []
      x-owner-service: Learning Content Service
      x-allowed-callers:
      - Progress Service
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseContextPage'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
  /lessons/{lessonId}/context:
    get:
      operationId: getLessonContext
      summary: getLessonContext
      description: Source derives internal hierarchy/ancestor visibility; Assessment
        validates Exercise lesson/course mapping and new start. Existing attempts
        use retained snapshot.
      security:
      - serviceIdentity: []
      x-owner-service: Learning Content Service
      x-allowed-callers:
      - Assessment Service
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LessonContext'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: lessonId
        in: path
        required: true
        schema: *id001
  /lessons/{lessonId}/exercise-readiness:
    get:
      operationId: getExerciseReadiness
      summary: getExerciseReadiness
      description: Content calls before publishing Lesson. ready iff exactly one ready
        Exercise mapping and >=1 valid supported Question, options/answer keys valid.
        Missing mapping=>200 ready=false, dependency DB down503. No callback to Content
        in this endpoint to avoid readiness/visibility cycle.
      security:
      - serviceIdentity: []
      x-owner-service: Assessment Service
      x-allowed-callers:
      - Learning Content Service
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseReadiness'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: lessonId
        in: path
        required: true
        schema: *id001
  /statistics/assessment-results:
    get:
      operationId: getAssessmentMetrics
      summary: getAssessmentMetrics
      description: Count all stored Results per type incl repeated attempts and TIMEOUT;
        Quiz/Test scorePercent sum (unrounded point ratio) and denominator result
        count, filtered start snapshot Course/Level. No Result=>counts0/sum0/count0;
        Progress exposes average null. Statistics averaging uses unrounded ratios
        then DTO rounds2 decimals.
      security:
      - serviceIdentity: []
      x-owner-service: Assessment Service
      x-allowed-callers:
      - Progress Service
      x-contract-status: PROPOSED_FOR_REVIEW
      responses:
        '200':
          description: Validated source response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentMetrics'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      parameters:
      - name: courseId
        in: query
        required: false
        schema: *id001
      - name: levelId
        in: query
        required: false
        schema: *id001
components:
  schemas:
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 UTC; server uses Z suffix.
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - field
      - code
      - message
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
        traceId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - code
      - message
      - traceId
      - errors
      example:
        code: VALIDATION_ERROR
        message: Dữ liệu không hợp lệ
        traceId: 10000000-0000-4000-8000-000000000001
        errors:
        - field: fullName
          code: TOO_LONG
          message: Tối đa 100 ký tự
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 15
          writeOnly: true
          description: 15 Unicode code points minimum AND at most 72 UTF-8 bytes.
            No trim/truncation; byte limit enforced by server, not maxLength.
        fullName:
          type: string
          minLength: 0
          maxLength: 100
          description: Trim; null or blank normalizes to null.
          nullable: true
      required:
      - email
      - password
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          writeOnly: true
      required:
      - email
      - password
    Profile:
      type: object
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 0
          maxLength: 100
          description: Trim; null or blank normalizes to null.
          nullable: true
        role:
          type: string
          enum:
          - LEARNER
          - ADMIN
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
      required:
      - userId
      - email
      - fullName
      - role
      - status
    ProfilePatch:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 0
          maxLength: 100
          description: Trim; null or blank normalizes to null.
          nullable: true
      required:
      - fullName
    LoginResponse:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/Profile'
        expiresAt:
          type: string
          format: date-time
          description: RFC3339 UTC; server uses Z suffix.
      required:
      - user
      - expiresAt
      description: JWT is only in Set-Cookie; no accessToken/password_hash in JSON.
    CsrfResponse:
      type: object
      additionalProperties: false
      properties:
        csrfToken:
          type: string
          minLength: 1
          maxLength: 512
        headerName:
          type: string
          enum:
          - X-CSRF-Token
      required:
      - csrfToken
      - headerName
    SetupWrite:
      type: object
      additionalProperties: false
      properties:
        courseId:
          type: string
          format: uuid
        levelId:
          type: string
          format: uuid
      required:
      - courseId
      - levelId
    Setup:
      type: object
      additionalProperties: false
      properties:
        courseId:
          type: string
          format: uuid
          nullable: true
        levelId:
          type: string
          format: uuid
          nullable: true
        updatedAt:
          type: string
          format: date-time
          description: RFC3339 UTC; server uses Z suffix.
          nullable: true
      required:
      - courseId
      - levelId
      - updatedAt
    AdminUserPatch:
      type: object
      additionalProperties: false
      properties:
        fullName:
          type: string
          minLength: 0
          maxLength: 100
          description: Trim; null or blank normalizes to null.
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - BLOCKED
      description: At least one field. Only Learner targets; role/email/password/userId
        not writable. Protect seeded Admin from status changes pending User policy
        review.
      minProperties: 1
    UserPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    CourseCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
    CoursePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        published:
          type: boolean
      minProperties: 1
    Course:
      type: object
      additionalProperties: false
      properties:
        courseId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        published:
          type: boolean
      required:
      - courseId
      - name
      - published
    Level:
      type: object
      additionalProperties: false
      properties:
        levelId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - levelId
      - courseId
      - name
    ModuleCreate:
      type: object
      additionalProperties: false
      properties:
        courseId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        orderNo:
          type: integer
          minimum: 1
      required:
      - courseId
      - title
      - orderNo
    ModulePatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        orderNo:
          type: integer
          minimum: 1
        published:
          type: boolean
      minProperties: 1
    Module:
      type: object
      additionalProperties: false
      properties:
        moduleId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        orderNo:
          type: integer
          minimum: 1
        published:
          type: boolean
      required:
      - moduleId
      - courseId
      - title
      - orderNo
      - published
    LessonCreate:
      type: object
      additionalProperties: false
      properties:
        moduleId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        orderNo:
          type: integer
          minimum: 1
      required:
      - moduleId
      - title
      - content
      - orderNo
    LessonPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        orderNo:
          type: integer
          minimum: 1
        published:
          type: boolean
      minProperties: 1
    Lesson:
      type: object
      additionalProperties: false
      properties:
        lessonId:
          type: string
          format: uuid
        moduleId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        orderNo:
          type: integer
          minimum: 1
        published:
          type: boolean
      required:
      - lessonId
      - moduleId
      - courseId
      - title
      - content
      - orderNo
      - published
    Vocabulary:
      type: object
      additionalProperties: false
      properties:
        vocabularyId:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        word:
          type: string
          minLength: 1
          maxLength: 128
        meaning:
          type: string
          minLength: 1
          maxLength: 500
        example:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
        phonetic:
          type: string
          minLength: 0
          maxLength: 128
          nullable: true
        published:
          type: boolean
      required:
      - vocabularyId
      - lessonId
      - courseId
      - word
      - meaning
      - example
      - phonetic
      - published
    VocabularyPatch:
      type: object
      additionalProperties: false
      properties:
        word:
          type: string
          minLength: 1
          maxLength: 128
        meaning:
          type: string
          minLength: 1
          maxLength: 500
        example:
          type: string
          minLength: 0
          maxLength: 1000
          nullable: true
        phonetic:
          type: string
          minLength: 0
          maxLength: 128
          nullable: true
        published:
          type: boolean
      description: Update existing imported Vocabulary only. Same uniqueness/normalization
        as Excel. No manual create API.
      minProperties: 1
    LearningContentCreate:
      type: object
      additionalProperties: false
      properties:
        lessonId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - GRAMMAR
          - LISTENING
          - READING
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          minLength: 1
          maxLength: 20000
          nullable: true
        resourceUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
      required:
      - lessonId
      - type
      - title
      description: GRAMMAR/READING require text. LISTENING requires configured HTTPS
        resourceUrl. Server does not fetch arbitrary client URLs; media upload/storage
        pipeline remains to review.
    LearningContentPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          minLength: 1
          maxLength: 20000
          nullable: true
        resourceUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        published:
          type: boolean
      minProperties: 1
    LearningContent:
      type: object
      additionalProperties: false
      properties:
        contentId:
          type: string
          format: uuid
        lessonId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - GRAMMAR
          - LISTENING
          - READING
        title:
          type: string
          minLength: 1
          maxLength: 200
        text:
          type: string
          minLength: 1
          maxLength: 20000
          nullable: true
        resourceUrl:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        published:
          type: boolean
        availability:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
      required:
      - contentId
      - lessonId
      - type
      - title
      - text
      - resourceUrl
      - published
      - availability
    LessonLearning:
      type: object
      additionalProperties: false
      properties:
        lesson:
          $ref: '#/components/schemas/Lesson'
        vocabulary:
          type: array
          items:
            $ref: '#/components/schemas/Vocabulary'
        contents:
          type: array
          items:
            $ref: '#/components/schemas/LearningContent'
        exerciseId:
          type: string
          format: uuid
      required:
      - lesson
      - vocabulary
      - contents
      - exerciseId
      description: Published/readiness checks. GET has no LessonCompletion side effect.
        Unavailable resource item remains explicit.
    SavedVocabulary:
      type: object
      additionalProperties: false
      properties:
        vocabularyId:
          type: string
          format: uuid
        addedAt:
          type: string
          format: date-time
          description: RFC3339 UTC; server uses Z suffix.
        availability:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
        content:
          type: object
          additionalProperties: false
          properties:
            word:
              type: string
              minLength: 1
              maxLength: 128
            meaning:
              type: string
              minLength: 1
              maxLength: 500
            example:
              type: string
              minLength: 0
              maxLength: 1000
              nullable: true
            phonetic:
              type: string
              minLength: 0
              maxLength: 128
              nullable: true
          required:
          - word
          - meaning
          - example
          - phonetic
          nullable: true
      required:
      - vocabularyId
      - addedAt
      - availability
      - content
      description: UNAVAILABLE requires content=null; source unavailable does not
        delete reference. Resolve only owner saved references, even if parent unpublished.
    CoursePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Course'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
      - size
      - totalElements
      - totalPages
    LevelPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Level'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
      - items
      - page
