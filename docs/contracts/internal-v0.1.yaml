  responses:
    '400':
      description: Malformed input / field validation / unknown fields
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: Invalid, expired, revoked or missing session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '403':
      description: Role/ownership/CSRF denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Resource missing or hidden to Learner
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '405':
      description: Method not allowed; forbidden FR-17 DELETE does not mutate data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '409':
      description: Conflict / not ready / invalid state / uniqueness race
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '413':
      description: Request or expanded file over configured limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '415':
      description: Unsupported media/file type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: Parseable import data invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Unexpected failure; local transaction rolled back
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '503':
      description: Session/source dependency unavailable; fail closed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
